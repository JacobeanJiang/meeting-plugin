<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会议白板</title>
<style>
:root{
  --paper:#f4f2ee;--surface:#fff;--ink:#17161a;--ink-2:#4f4b45;--muted:#948f86;--line:rgba(23,22,26,.08);--line-2:rgba(23,22,26,.14);
  --rec:#ff4d2e;--rec-glow:rgba(255,77,46,.35);--amber:#f2a33a;--ok:#1f8a5b;--warn-bg:#fff4ec;--warn:#a8481c;
  --radius:16px;--ease:cubic-bezier(.2,.8,.2,1);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);color-scheme:light;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(1200px 500px at 85% -10%,rgba(255,77,46,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(31,138,91,.06),transparent 60%),var(--paper)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
.num{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ---------- top bar ---------- */
.bar{position:relative;z-index:10;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:14px 18px 10px;animation:rise .5s var(--ease) both}
.ident{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:34px;height:34px;border-radius:11px;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:0 6px 16px -8px rgba(23,22,26,.6)}
.mark i{display:block;width:3px;border-radius:2px;background:#fff;animation:mark 1.6s ease-in-out infinite}
.mark i:nth-child(1){height:8px}.mark i:nth-child(2){height:16px;animation-delay:.2s}.mark i:nth-child(3){height:11px;animation-delay:.4s}
body:not(.live) .mark i{animation:none}
.names{min-width:0}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme{margin:1px 0 0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme.wait{color:var(--muted)}

/* recording capsule */
.capsule{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 16px;border-radius:999px;background:var(--ink);color:#fff;
  box-shadow:0 14px 30px -14px rgba(23,22,26,.55),inset 0 0 0 1px rgba(255,255,255,.06);transition:background .3s,color .3s}
.dot{width:9px;height:9px;border-radius:50%;background:#8b8781;flex:none;position:relative}
.capsule[data-phase=recording] .dot{background:var(--rec)}
.capsule[data-phase=recording] .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--rec-glow);animation:ping 1.6s var(--ease) infinite}
.capsule[data-phase=starting] .dot{animation:blink 1s ease-in-out infinite}
.capsule[data-phase=paused] .dot{background:var(--amber)}
#phase{font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap}
#clock{font-size:15px;font-weight:600;min-width:52px}
.wave{display:flex;align-items:center;gap:2.5px;height:22px;width:74px}
.wave i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.85);transition:height .12s linear}
.capsule .ctl{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:background .2s}
.capsule .ctl:hover:not(:disabled){background:rgba(255,255,255,.22)}
.capsule .end{height:32px;padding:0 14px;border-radius:999px;background:var(--rec);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;transition:filter .2s}
.capsule .end:hover:not(:disabled){filter:brightness(1.08)}
.capsule[data-phase=complete],.capsule[data-phase=interrupted]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.capsule[data-phase=complete] #phase,.capsule[data-phase=interrupted] #phase{color:var(--muted)}
.capsule[data-phase=complete] .rec-only,.capsule[data-phase=interrupted] .rec-only{display:none}
.capsule[data-phase=complete]{padding-right:16px}

/* right tools */
.tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.ai{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;min-width:0}
.ai span{overflow:hidden;text-overflow:ellipsis}
.ai.busy span{background:linear-gradient(90deg,var(--ink-2) 0%,var(--ink-2) 35%,#c9c3b8 50%,var(--ink-2) 65%,var(--ink-2) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.2s linear infinite}
.ai svg{flex:none;color:var(--rec)}
.ai.busy svg{animation:spin 3s linear infinite}
.chip{height:34px;padding:0 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;transition:box-shadow .2s,background .2s}
.chip:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink)}
.chip small{color:var(--muted);font-size:11.5px}
.icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2)}
body.panel-open #toggle{background:var(--ink);color:#fff;box-shadow:none}
.picker{position:relative}
.menu{position:absolute;right:0;top:42px;z-index:20;width:268px;padding:6px;border-radius:14px;background:var(--surface);box-shadow:0 22px 50px -18px rgba(23,22,26,.4),0 0 0 1px var(--line);transform-origin:top right;animation:pop .18s var(--ease) both}
.menu[hidden]{display:none}
.tabs{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--paper)}
.tab{height:26px;padding:0 10px;white-space:nowrap;flex:none;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
body.no-ai .ai-setting,body.no-ai .pop{display:none!important}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(23,22,26,.12)}
.tab em{font-style:normal;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--rec);color:#fff;font-size:10.5px;display:grid;place-items:center}
.tab em[hidden]{display:none}
body.tab-ai .feed,body.tab-ai .cite,body.tab-ai .jump,body.tab-ai #summary{display:none!important}
.ailist{flex:1;min-height:0;overflow:auto;padding:4px 12px 16px;display:none}
body.tab-ai .ailist{display:block}
body.tab-minutes .feed,body.tab-minutes .cite,body.tab-minutes .jump,body.tab-minutes #summary,body.tab-minutes .ailist{display:none!important}
.minutes{flex:1;min-height:0;overflow:auto;padding:4px 16px 16px;display:none}
body.tab-minutes .minutes{display:block}
.minutes .md{margin-top:0;padding-top:0;border-top:0;font-size:13.5px}
.minutes .md h1{font-size:16px}.minutes .md h2,.minutes .md h3{font-size:14px;margin-top:14px}
.minutes-bar{display:flex;align-items:center;gap:8px;padding:6px 0 10px;font-size:12px;color:var(--muted)}
.minutes-bar span{flex:1}
.minutes button.make{height:30px;padding:0 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;margin-top:10px}
.minutes-bar button{height:26px;padding:0 9px;border-radius:7px;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.task{margin:8px 0;padding:12px 13px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);animation:pop .2s var(--ease) both}
.task.still{animation:none}
.task.fresh{box-shadow:0 0 0 2px var(--ink)}
.task header{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11.5px;color:var(--muted)}
.task .st{padding:2px 7px;border-radius:999px;background:var(--paper);color:var(--ink-2);font-weight:600}
.task .st.running{background:#eef2ff;color:#3b4bbf}.task .st.done{background:#e7f6ec;color:#1f7a45}.task .st.failed{background:#fdecea;color:#b3261e}
.task h4{margin:0 0 4px;font-size:13.5px;line-height:1.5}
.task .quote{font-size:12px;color:var(--muted);line-height:1.6;cursor:pointer}.task .quote:hover{color:var(--ink)}
.task .err{margin-top:8px;font-size:12px;color:#b3261e;line-height:1.6}
.md{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{font-size:13.5px;margin:8px 0 4px}.md p{margin:4px 0}.md ul,.md ol{margin:4px 0;padding-left:18px}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--paper);padding:1px 4px;border-radius:4px}
.md pre{background:var(--paper);padding:8px;border-radius:8px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;font-size:12px;margin:6px 0;display:block;overflow:auto}.md th,.md td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.md a{color:#3b4bbf}
.ai-empty{padding:28px 6px;color:var(--muted);font-size:13px;line-height:1.7}.ai-empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.ai-empty button{margin-top:10px;height:30px;padding:0 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px}
.pop{position:absolute;right:16px;bottom:16px;z-index:15;width:min(380px,calc(100% - 32px));max-height:60%;overflow:auto;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:0 24px 60px -20px rgba(23,22,26,.45),0 0 0 1px var(--line);animation:pop .22s var(--ease) both}
.pop[hidden]{display:none}
.pop .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.pop .who b{color:var(--ink);font-size:12px}
.pop h4{margin:0;font-size:14px;line-height:1.5}
.pop .acts{display:flex;gap:6px;margin-top:10px}
.pop .acts button{height:28px;padding:0 10px;border-radius:8px;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.pop .acts .primary{background:var(--ink);color:#fff;box-shadow:none}
.menu.meetings{left:0;right:auto;top:42px;width:300px;max-height:min(440px,70vh);overflow:auto;transform-origin:top left}
.menu.meetings .new{background:var(--ink);color:var(--surface);margin-bottom:4px}.menu.meetings .new:hover{background:var(--ink-2)}.menu.meetings .new .glyph{background:rgba(255,255,255,.16);color:inherit}.menu.meetings .new em{color:rgba(255,255,255,.72)}
.menu.meetings .new.confirm{background:var(--rec)}
.menu.meetings .head{padding:8px 10px 4px;font-size:11.5px;color:var(--muted)}
.menu.meetings .live-dot{width:7px;height:7px;border-radius:50%;background:var(--rec)}
.menu button{width:100%;text-align:left;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 10px;border-radius:9px}
.menu button:hover{background:var(--paper)}
.menu b{display:block;font-weight:600;font-size:13px}
.menu em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.menu .on{background:var(--paper)}
.menu .on::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
.menu .glyph{width:22px;height:22px;border-radius:7px;background:var(--paper);display:grid;place-items:center;color:var(--ink-2)}
.menu .note{padding:8px 10px 4px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}

/* ---------- workspace ---------- */
main{flex:1;min-height:0;display:flex;gap:12px;padding:4px 12px 12px}
.stage{position:relative;flex:1;min-width:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 1px var(--line),0 30px 60px -40px rgba(23,22,26,.35);animation:rise .6s .05s var(--ease) both}
iframe{display:block;border:0;width:100%;height:100%}
.listening{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;pointer-events:none;padding:24px;width:min(360px,90%)}
.listening[hidden]{display:none}
.orb{position:relative;width:68px;height:68px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(23,22,26,.25);animation:ring 2.4s var(--ease) infinite}
.orb::after{animation-delay:1.2s}
.listening.idle .orb::before,.listening.idle .orb::after{animation:none;opacity:0}
.listening h2{margin:0;font-size:16px;font-weight:650}
.listening p{margin:0;font-size:13px;color:var(--muted)}

/* transcript panel */
.panel{width:340px;flex:none;display:flex;flex-direction:column;min-height:0;border-radius:var(--radius);background:rgba(255,255,255,.72);
  backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line);overflow:hidden;animation:rise .6s .1s var(--ease) both}
body:not(.panel-open) .panel{display:none}
.panel-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px 16px}
.panel-head h3{margin:0;font-size:13.5px;font-weight:650}
.panel-head .spacer{flex:1}
.panel-head .ghost{white-space:nowrap;flex:none}
.ghost{height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.ghost:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.feed{position:relative;flex:1;min-height:0;overflow:auto;padding:4px 16px 16px;scroll-behavior:smooth}
.line{position:relative;padding:10px 0 10px 54px;animation:enter .45s var(--ease) both}
.line time{position:absolute;left:0;top:12px;font-size:11px;color:var(--muted)}
.line p{margin:0;font-size:14px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.line.now p{color:var(--ink)}
.line.now::before{content:"";position:absolute;left:42px;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--rec)}
.line.failed p{color:var(--warn)}
.pending{display:flex;align-items:center;gap:8px;padding:10px 0 4px 54px;font-size:12.5px;color:var(--muted)}
.pending[hidden]{display:none}
.dots{display:inline-flex;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--muted);animation:bounce 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.empty{padding:28px 6px;color:var(--muted);font-size:13px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:4px}
.jump{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;box-shadow:0 10px 24px -10px rgba(23,22,26,.6);animation:pop .2s var(--ease) both}
.jump[hidden]{display:none}
.panel-foot{display:flex;align-items:center;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.panel-foot span{flex:1}
.retry{color:var(--warn);font-weight:600;font-size:12px}
.rawtoggle{height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}.rawtoggle[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}.rawtoggle[hidden]{display:none}
.retry[hidden]{display:none}

/* toast */
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;max-width:min(560px,92vw);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;box-shadow:0 12px 30px -16px rgba(168,72,28,.5),0 0 0 1px rgba(168,72,28,.15);animation:pop .2s var(--ease) both}
.toast[hidden]{display:none}
.toast button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.toast button:hover{background:rgba(168,72,28,.1)}


.line .no{position:absolute;left:0;top:30px;font-size:10px;color:#c2bdb3}
.line.cited{background:linear-gradient(90deg,rgba(255,77,46,.08),rgba(255,77,46,0) 85%);border-radius:10px;margin:0 -10px;padding-left:64px;padding-right:10px}
.line.cited time{left:10px}.line.cited .no{left:10px;color:var(--rec)}
.line.cited p{color:var(--ink)}
.line.chatter p{color:#b8b3aa;font-size:13px}
.line.chatter time::after{content:"闲聊";margin-left:6px;padding:0 5px;border-radius:4px;background:var(--paper);color:var(--muted);font-family:-apple-system,"PingFang SC",sans-serif;font-size:10px}
.cite{display:flex;align-items:flex-start;gap:8px;margin:0 12px 6px;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:12.5px;animation:pop .2s var(--ease) both}
.cite[hidden]{display:none}
.cite span{flex:1;min-width:0}.cite b{display:block;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cite em{font-style:normal;color:rgba(255,255,255,.65)}
.cite button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff}.cite button:hover{background:rgba(255,255,255,.14)}
.ai .delta{margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;animation:pop .2s var(--ease) both}
.ai .delta[hidden]{display:none}

.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(400px,100vw);background:var(--surface);box-shadow:-30px 0 60px -30px rgba(23,22,26,.45),0 0 0 1px var(--line);display:flex;flex-direction:column;animation:slide .22s var(--ease) both}
.drawer[hidden]{display:none}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(23,22,26,.18)}.scrim[hidden]{display:none}
.drawer header{display:flex;align-items:center;padding:16px 16px 10px 20px}.drawer header h3{margin:0;flex:1;font-size:15px}
.drawer .body{flex:1;overflow:auto;padding:0 20px 16px}
.drawer h4{margin:18px 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.drawer label{display:block;margin:10px 0;font-size:13px;color:var(--ink-2)}
.drawer select,.drawer textarea,.drawer input[type=text]{display:block;width:100%;margin-top:5px;padding:8px 10px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface);font:inherit;color:var(--ink)}
.drawer select:focus,.drawer textarea:focus,.drawer input:focus{outline:2px solid var(--ink);outline-offset:0}
.drawer [hidden]{display:none!important}
.drawer small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
.drawer .check{display:flex;gap:8px;align-items:flex-start}.drawer .check input{margin-top:3px;accent-color:var(--ink)}
.drawer footer{display:flex;align-items:center;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.drawer footer span{flex:1;font-size:11.5px;color:var(--muted)}
.drawer .save{height:34px;padding:0 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translate(var(--tx,0),4px) scale(.97)}to{opacity:1}}
.jump,.toast{--tx:-50%}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes mark{50%{transform:scaleY(.45)}}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-3px);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1080px){.panel{width:300px}.ai span{display:none}}
/* Narrow pages (a side browser): one compact bar, so the board keeps as much height as possible; captions open over the board. */
@media (max-width:900px){
  .bar{grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:8px 10px 6px}
  .mark,.theme,.wave,#phase,.ai{display:none}
  h1{font-size:14px}
  .capsule{height:36px;gap:8px;padding:0 4px 0 12px}
  .capsule .ctl{width:28px;height:28px}.capsule .end{height:28px;padding:0 10px}
  .tools{gap:6px}.chip{height:30px;padding:0 9px}.icon{width:30px;height:30px}
  main{position:relative;padding:2px 6px 6px;gap:6px}
  .stage{--radius:12px}

<script>
const base=new URL('api',location.href);const $=id=>document.getElementById(id);
const PHASE={starting:'正在打开麦克风',recording:'录音中',paused:'已暂停',stopping:'正在收尾',complete:'已结束',interrupted:'录音中断'};
const FORMS=[['mindmap','思维导图','主题 → 议题 → 观点（默认）','✳'],['topics','议题分区','评审、决策、多个议题','▦'],['flow','流程线','步骤、流程、排期','→'],['matrix','方案对比','多个方案取舍','⊞'],['status','进度看板','站会、周会、进度同步','☰']];
const ICON={pause:'<svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="1.5" width="2.6" height="9" rx="1" fill="currentColor"/><rect x="7.4" y="1.5" width="2.6" height="9" rx="1" fill="currentColor"/></svg>',play:'<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.8v8.4c0 .5.5.8.9.5l6.4-4.2a.6.6 0 0 0 0-1L3.9 1.3c-.4-.3-.9 0-.9.5Z" fill="currentColor"/></svg>'};
let latest=null,busy=false,loaded='',level=0,stick=true,toastKey='',dismissed='',cited=new Set(),citeFor='',seenChange=0,deltaTimer=0;const rendered=new Map();
const time=ms=>{const n=Math.max(0,Math.floor(ms/1000));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0')};
const wave=$('wave');for(let i=0;i<14;i++)wave.append(document.createElement('i'));
for(const [form,name,hint,glyph] of FORMS){const b=document.createElement('button');b.setAttribute('role','menuitemradio');b.dataset.form=form;const g=document.createElement('span');g.className='glyph';g.textContent=glyph;const t=document.createElement('span');const n=document.createElement('b');n.textContent=name;const e=document.createElement('em');e.textContent=hint;t.append(n,e);b.append(g,t);b.onclick=()=>{closeMenu();post({action:'layout',form})};$('menu').append(b)}
{const again=document.createElement('button');again.dataset.refresh='1';const g=document.createElement('span');g.className='glyph';g.textContent='↻';const t=document.createElement('span');const n=document.createElement('b');n.textContent='按当前形式重新整理全场';const e=document.createElement('em');e.textContent='合并重复、补齐分组小结；完成前保留当前白板';t.append(n,e);again.append(g,t);again.onclick=()=>{closeMenu();const p=latest&&latest.meeting&&latest.meeting.plan;if(p)post({action:'layout',form:p.form,refresh:true})};$('menu').append(again)}
{const note=document.createElement('div');note.className='note';note.textContent='新会议默认使用设置里的形式；在这里切换后不再自动更换。';$('menu').append(note)}
function closeMenu(){$('menu').hidden=true;$('formBtn').setAttribute('aria-expanded','false')}
$('formBtn').onclick=e=>{e.stopPropagation();const open=$('menu').hidden;$('menu').hidden=!open;$('formBtn').setAttribute('aria-expanded',String(open))};
document.addEventListener('click',e=>{if(!$('menu').contains(e.target))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function toast(text){if(!text){$('toast').hidden=true;toastKey='';return}if(text===dismissed)return;toastKey=text;$('toastText').textContent=text;$('toast').hidden=false}
$('toastClose').onclick=()=>{dismissed=toastKey;$('toast').hidden=true};
function render(data){
  const m=data.snapshot.meeting;if(!m)return;latest=data.snapshot;level=typeof latest.levelDbfs==='number'?Math.min(1,Math.max(0,(latest.levelDbfs+55)/45)):0;
  const live=['starting','recording','paused','stopping'].includes(m.phase);document.body.classList.toggle('live',m.phase==='recording');
  $('title').textContent=m.title;document.title=m.title+' · 会议白板';
  const plan=m.plan;
  // Anything on the board besides the title counts, including cards the conversation wrote there itself.
  const hasBoard=(plan&&m.items.length)||data.boardItems>0;
  const preferred=FORMS.find(f=>f[0]===(latest.settings&&latest.settings.defaultForm))||FORMS[0];
  $('theme').textContent=plan&&plan.theme?plan.theme:!plan?(live?'正在了解会议主题…':'本场内容不足以生成白板'):'会议主题整理中';$('theme').classList.toggle('wait',!plan||!plan.theme);

  $('pause').innerHTML=m.phase==='paused'?ICON.play:ICON.pause;$('pause').setAttribute('aria-label',m.phase==='paused'?'继续录音':'暂停录音');

  const switching=m.requestedForm&&FORMS.find(f=>f[0]===m.requestedForm);const ai=$('ai');ai.classList.toggle('busy',m.summaryState==='working'||!!switching||(!plan&&live));
  $('ai').title=switching?'新形式整理好之前，白板保持当前内容':'';$('aiText').textContent=switching?'正在切换为「'+switching[1]+'」…':m.summaryState==='working'?'AI 正在整理':!plan?(live?'AI 正在聆听':'未生成白板'):'已整理到 '+time(through?through.endMs:0);
  const ch=m.lastChange;if(ch&&ch.at!==seenChange){if(seenChange){const parts=[];if(ch.rebuilt)parts.push('已按新形式重排');else{if(ch.added)parts.push('新增 '+ch.added);if(ch.revised)parts.push('更新 '+ch.revised);if(ch.linked)parts.push('关联 '+ch.linked)}if(parts.length){$('delta').textContent=parts.join(' · ');$('delta').hidden=false;clearTimeout(deltaTimer);deltaTimer=setTimeout(()=>$('delta').hidden=true,8000)}}seenChange=ch.at}
  const current=plan?FORMS.find(f=>f[0]===plan.form):preferred;$('formLabel').textContent=current?current[1]:'白板形式';$('formBy').textContent=switching?'切换中':!plan?'默认':plan.lockedBy==='user'?'已指定':'AI 选择';
  for(const b of $('menu').querySelectorAll('button[data-form]')){const on=plan&&b.dataset.form===plan.form;b.classList.toggle('on',!!on);b.setAttribute('aria-checked',String(!!on))}
  $('formBtn').disabled=!live&&m.phase!=='complete'&&m.phase!=='interrupted';
  $('summary').disabled=busy||m.summaryState==='working'||!done.length;
  const listening=$('listening');listening.hidden=!!hasBoard;listening.classList.toggle('idle',!live);
  $('listenTitle').textContent=plan?(m.summaryState==='working'?'正在绘制白板':'还没有可上板的内容'):live?(m.phase==='paused'?'录音已暂停':'正在聆听'):'没有生成白板';
  $('listenText').textContent=plan?'已判断出会议主题，AI 正在提炼第一批要点。':live?(latest.settings&&latest.settings.autoSummary===false?'自动整理已关闭，字幕照常记录；可在右上角设置里打开，或点“立即整理”。':'先听一会儿，内容足够后开始画「'+preferred[1]+'」。'):'这场会议的有效发言较少，可以在右侧查看转写原文。';
  const setup=latest.setup;if(setup&&setup.status!=='ready'&&!hasBoard){listening.hidden=false;$('listenTitle').textContent=setup.status==='failed'?'识别模型下载失败':'正在准备识别模型';$('listenText').textContent=setup.status==='failed'?(setup.error||'请检查网络')+'。录音已保存，可在会议助手页点“重新下载”，完成后自动转写。':setup.status==='downloading'&&setup.total?'首次使用需下载约 '+Math.round(setup.total/1048576)+'MB，已完成 '+Math.floor(setup.received/setup.total*100)+'%。录音照常进行，下载完成后自动补上转写。':'正在检查本机识别模型…'}
  if(loaded!==data.boardUrl){$('board').src=data.boardUrl;loaded=data.boardUrl}
  else if(data.boardSpace&&boardSpace&&data.boardSpace!==boardSpace)setTimeout(fitBoard,1200); // redrawn for a different screen size: fit once the new layout is in
  if(data.boardSpace)boardSpace=data.boardSpace;
  renderFeed(m,latest.pending);renderTasks(m);renderMinutes(m);
  const failed=m.segments.filter(s=>s.status==='failed').length;$('retry').hidden=!failed;$('retry').textContent='重试 '+failed+' 段失败';$('retry').disabled=busy||live;
  $('foot').textContent=done.length?done.length+' 段发言 · 白板可直接编辑，改动实时保存':'白板可直接编辑，改动实时保存';
  toast(data.boardError||m.error||m.summaryError||'');
}
function renderFeed(m,pending){
  const feed=$('feed');const nearBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<80;
  const shown=m.segments.filter(s=>s.status==='done'||s.status==='failed');
  const keep=new Set(shown.map(s=>s.id));for(const [id,node] of rendered)if(!keep.has(id)){node.remove();rendered.delete(id)}
  let added=false;
  for(const s of shown){let node=rendered.get(s.id);
    if(!node){node=document.createElement('div');node.className='line';const t=document.createElement('time');t.className='num';const no=document.createElement('span');no.className='no num';node.append(t,no,document.createElement('p'));node.dataset.id=s.id;rendered.set(s.id,node);added=true}
    node.querySelector('time').textContent=time(s.startMs);node.querySelector('.no').textContent='#'+(s.seq+1);node.classList.toggle('chatter',s.tag==='chatter');node.classList.toggle('cited',cited.has(s.id));const p=node.querySelector('p');p.textContent=s.status==='done'?(showRaw&&s.raw?s.raw:s.text):'这段没有识别成功，录音已保留，会后可重试';p.title=s.raw?(showRaw?'AI 校对后：'+s.text:'原始识别：'+s.raw):'';node.classList.toggle('failed',s.status==='failed');}
  $('rawToggle').hidden=!shown.some(s=>s.raw);
  const ordered=shown.map(s=>rendered.get(s.id));ordered.forEach((node,i)=>{node.classList.toggle('now',i===ordered.length-1&&s_live(m));if(feed.children[i]!==node)feed.insertBefore(node,feed.children[i]||null)});
  let pend=$('pendingRow');if(!pend){pend=document.createElement('div');pend.id='pendingRow';pend.className='pending';pend.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span></span>'}
  pend.hidden=!pending;pend.lastChild.textContent='正在识别'+(pending>1?' '+pending+' 段':'');feed.append(pend);
  let empty=$('emptyRow');if(!shown.length&&!pending){if(!empty){empty=document.createElement('div');empty.id='emptyRow';empty.className='empty'}const live=s_live(m);empty.innerHTML='';const b=document.createElement('b');b.textContent=live?'正在倾听':'没有识别到发言';empty.append(b,document.createTextNode(live?'说话后约 15 秒，文字会出现在这里；安静的片段不会显示。':'这场会议没有识别到有效发言。'));feed.prepend(empty)}else if(empty)empty.remove();
  if(added){if(stick||nearBottom){feed.scrollTop=feed.scrollHeight;$('jump').hidden=true}else $('jump').hidden=false}
}
const s_live=m=>['starting','recording','paused','stopping'].includes(m.phase);
let showRaw=false;
$('rawToggle').onclick=()=>{showRaw=!showRaw;$('rawToggle').setAttribute('aria-pressed',String(showRaw));if(latest&&latest.meeting)renderFeed(latest.meeting,latest.pending)};
$('feed').addEventListener('scroll',()=>{const f=$('feed');stick=f.scrollHeight-f.scrollTop-f.clientHeight<80;if(stick)$('jump').hidden=true});

function inline(text){let s=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');return s}
function markdown(src){const lines=String(src||'').replace(/\r/g,'').split('\n');const out=[];let list=null,code=null,table=null;
  const close=()=>{if(list){out.push('</'+list+'>');list=null}if(table){out.push('</table>');table=null}};
  for(const raw of lines){if(code!==null){if(/^```/.test(raw)){out.push('<pre><code>'+code.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>');code=null}else code+=raw+'\n';continue}
    if(/^```/.test(raw)){close();code='';continue}
    const line=raw.trimEnd();if(!line.trim()){close();continue}
    let m;
    if(/^\|.*\|$/.test(line.trim())){const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;if(!table){close();out.push('<table>');table=1;out.push('<tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>')}else out.push('<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');continue}
    if((m=line.match(/^(#{1,4})\s+(.*)$/))){close();out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');continue}
    if((m=line.match(/^\s*[-*•]\s+(.*)$/))){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+inline(m[1])+'</li>');continue}
    if((m=line.match(/^\s*\d+[.)、]\s*(.*)$/))){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+inline(m[1])+'</li>');continue}
    close();out.push('<p>'+inline(line)+'</p>')}
  if(code!==null)out.push('<pre><code>'+code.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>');close();return out.join('')}

function reportViewport(){const width=stageWidth();if(!width)return;reportedWidth=width;fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'viewport',width,height:Math.round(document.querySelector('.stage').clientHeight)})}).catch(()=>{})}
function fitBoard(){const frame=$('board');if(loaded&&frame.contentWindow)frame.contentWindow.postMessage({type:'xj-meeting-board-fit'},'*')}
addEventListener('message',event=>{if(event.source===$('board').contentWindow&&event.data&&event.data.type==='xj-meeting-board-ready')setTimeout(fitBoard,300)});
addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(Math.abs(stageWidth()-reportedWidth)>8)reportViewport()},500)});
setTimeout(reportViewport,300);setInterval(reportViewport,20000);
</script>
</body>
</html>
