<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会议白板</title>
<style>
:root{
  --paper:#f4f2ee;--surface:#fff;--ink:#17161a;--ink-2:#4f4b45;--muted:#948f86;--line:rgba(23,22,26,.08);--line-2:rgba(23,22,26,.14);
  --rec:#ff4d2e;--rec-glow:rgba(255,77,46,.35);--amber:#f2a33a;--ok:#1f8a5b;--warn-bg:#fff4ec;--warn:#a8481c;
  --radius:16px;--ease:cubic-bezier(.2,.8,.2,1);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);color-scheme:light;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(1200px 500px at 85% -10%,rgba(255,77,46,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(31,138,91,.06),transparent 60%),var(--paper)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
.num{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ---------- top bar ---------- */
.bar{position:relative;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px 10px;animation:rise .5s var(--ease) both}
.ident{flex:1 1 auto;display:flex;align-items:center;gap:6px 12px;min-width:0}
h1{margin:0;flex:0 1 auto;min-width:0;font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{flex:none;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* status chip with the recording controls, as on the plugin page */
.capsule{flex:none;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:12px;white-space:nowrap;transition:background .3s,color .3s}
.dot{width:7px;height:7px;border-radius:50%;background:#aaa59c;flex:none}
.capsule[data-phase=recording],.capsule[data-phase=paused],.capsule[data-phase=starting]{padding-right:3px}
.capsule[data-phase=recording]{background:#fff6f3;color:var(--rec);box-shadow:inset 0 0 0 1px rgba(255,77,46,.28)}
.capsule[data-phase=recording] .dot{background:var(--rec);box-shadow:0 0 0 3px rgba(255,77,46,.18)}
.capsule[data-phase=starting] .dot{animation:blink 1s ease-in-out infinite}
.capsule[data-phase=paused] .dot{background:var(--amber)}
#clock{font-size:12.5px;font-weight:600;color:var(--ink)}
.wave{display:flex;align-items:center;gap:2px;height:14px;width:30px}
.wave i{flex:1;height:3px;border-radius:2px;background:var(--rec);transition:height .12s linear}
.capsule:not([data-phase=recording]) .wave{display:none}
.capsule .ctl{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:inherit}
.capsule .ctl:hover:not(:disabled){background:rgba(23,22,26,.06)}
.capsule .end{height:24px;padding:0 10px;border-radius:999px;background:var(--rec);color:#fff;font-weight:600;font-size:11.5px;transition:filter .2s}
.capsule .end:hover:not(:disabled){filter:brightness(1.08)}
.capsule[data-phase=complete] .rec-only,.capsule[data-phase=interrupted] .rec-only,.capsule[data-phase=stopping] .rec-only{display:none}

/* right tools */
.tools{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.tools .ai{margin-right:6px}
.ai{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;min-width:0}
.ai span{overflow:hidden;text-overflow:ellipsis}
.ai.busy span{background:linear-gradient(90deg,var(--ink-2) 0%,var(--ink-2) 35%,#c9c3b8 50%,var(--ink-2) 65%,var(--ink-2) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.2s linear infinite}
.ai svg{flex:none;color:var(--rec)}
.ai.busy svg{animation:spin 3s linear infinite}
.chip{height:32px;padding:0 11px;margin-right:4px;border-radius:9px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;transition:box-shadow .2s,background .2s}
.chip:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink)}
.chip small{color:var(--muted);font-size:11.5px}
.icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.icon:hover:not(:disabled){background:#eeece7;color:var(--ink)}
body.panel-open #toggle{background:#e6e3dc;color:var(--ink)}
.picker{position:relative}
.menu{position:absolute;right:0;top:42px;z-index:20;width:268px;padding:6px;border-radius:14px;background:var(--surface);box-shadow:0 22px 50px -18px rgba(23,22,26,.4),0 0 0 1px var(--line);transform-origin:top right;animation:pop .18s var(--ease) both}
.menu[hidden]{display:none}
#menu{max-height:calc(100dvh - 60px);overflow-y:auto}
.tabs{display:flex;gap:2px;align-self:stretch}
.tab{position:relative;height:42px;padding:0 9px;white-space:nowrap;flex:none;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
body.no-ai .ai-setting,body.no-ai .pop{display:none!important}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:7px;right:7px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.tab em{font-style:normal;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--rec);color:#fff;font-size:10.5px;display:grid;place-items:center}
.tab em[hidden]{display:none}
body.tab-ai .feed,body.tab-ai .cite,body.tab-ai .jump,body.tab-ai #summary{display:none!important}
.ailist{flex:1;min-height:0;overflow:auto;padding:4px 12px 16px;display:none}
body.tab-ai .ailist{display:block}
body.tab-minutes .feed,body.tab-minutes .cite,body.tab-minutes .jump,body.tab-minutes #summary,body.tab-minutes .ailist{display:none!important}
.minutes{flex:1;min-height:0;overflow:auto;padding:4px 16px 16px;display:none}
body.tab-minutes .minutes{display:block}
.minutes .md{margin-top:0;padding-top:0;border-top:0;font-size:13.5px}
.minutes .md h1{font-size:16px}.minutes .md h2,.minutes .md h3{font-size:14px;margin-top:14px}
.minutes-bar{display:flex;align-items:center;gap:8px;padding:6px 0 10px;font-size:12px;color:var(--muted)}
.minutes-bar span{flex:1}
.minutes button.make{height:30px;padding:0 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;margin-top:10px}
.minutes-bar button{height:26px;padding:0 9px;border-radius:7px;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.task{margin:8px 0;padding:12px 13px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);animation:pop .2s var(--ease) both}
.task.still{animation:none}
.task.fresh{box-shadow:0 0 0 2px var(--ink)}
.task header{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11.5px;color:var(--muted)}
.task .st{padding:2px 7px;border-radius:999px;background:var(--paper);color:var(--ink-2);font-weight:600}
.task .st.running{background:#eef2ff;color:#3b4bbf}.task .st.confirm{background:#fff4e5;color:#a05a00}.task .st.skipped{color:var(--muted)}
.task .scene{margin:-2px 0 4px;font-size:11.5px;color:var(--muted)}
.task .decide{display:flex;gap:6px;margin-top:10px}.task .decide button{height:28px;padding:0 12px;border-radius:8px;font-size:12.5px;box-shadow:inset 0 0 0 1px var(--line-2)}.task .decide .primary{background:var(--ink);color:#fff;box-shadow:none}.task .st.done{background:#e7f6ec;color:#1f7a45}.task .st.failed{background:#fdecea;color:#b3261e}
.task h4{margin:0 0 4px;font-size:13.5px;line-height:1.5}
.task .quote{font-size:12px;color:var(--muted);line-height:1.6;cursor:pointer}.task .quote:hover{color:var(--ink)}
.task .err{margin-top:8px;font-size:12px;color:#b3261e;line-height:1.6}
.md{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{font-size:13.5px;margin:8px 0 4px}.md p{margin:4px 0}.md ul,.md ol{margin:4px 0;padding-left:18px}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--paper);padding:1px 4px;border-radius:4px}
.md pre{background:var(--paper);padding:8px;border-radius:8px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;font-size:12px;margin:6px 0;display:block;overflow:auto}.md th,.md td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.md a{color:#3b4bbf}
.todos{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.todos-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.todos-head b{font-size:13.5px}.todos-head span{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.todos button{height:26px;padding:0 9px;border-radius:7px;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface);white-space:nowrap}
.todos button.pri{background:var(--ink);color:#fff;box-shadow:none}.todos button:disabled{opacity:.55}
.todo-filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}.todo-filters button{height:24px;border-radius:999px}.todo-filters button.on{background:var(--ink);color:#fff;box-shadow:none}
.todo-row{border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;margin:8px 0;background:var(--surface)}.todo-row.marked{background:var(--paper);box-shadow:none}
.todo-line{display:flex;gap:8px;align-items:flex-start}.todo-line .t{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow-wrap:anywhere}.todo-row.marked .t{color:var(--muted);text-decoration:line-through}
.todo-st{flex:none;font-size:11.5px;border-radius:999px;padding:1px 8px;margin-top:1px;background:var(--paper);color:var(--muted);white-space:nowrap}
.todo-st.ok{background:#e6f2ea;color:#2f6b4f}.todo-st.run{background:#fff1dc;color:#9a5b12}.todo-st.wait{background:#ebe5fa;color:#5b4a8a}.todo-st.gray{background:#e9e6df}
.todo-box{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--paper)}.todo-box.dim{opacity:.6}
.todo-box-head{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:11.5px;color:var(--muted)}.todo-box-head b{color:var(--ink-2);font-weight:600}
.todo-body{margin-top:4px;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.todo-box .md{margin-top:4px;padding-top:0;border-top:0}
.todo-box .clip{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.todo-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.todo-hint{margin-top:6px;font-size:12px;color:var(--muted)}.todo-hint a{color:#3b4bbf;cursor:pointer}.todo-hint.err{color:#b8402a}
.todo-edit{margin-top:8px}.todo-edit textarea{width:100%;box-sizing:border-box;min-height:56px;resize:vertical;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px var(--line-2);padding:6px 8px;font:13px/1.6 inherit;background:var(--surface);color:var(--ink)}
.todos .note{font-size:12px;color:var(--muted);margin:4px 0}
.ai-empty{padding:28px 6px;color:var(--muted);font-size:13px;line-height:1.7}.ai-empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.ai-empty button{margin-top:10px;height:30px;padding:0 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px}
.pop{position:absolute;right:16px;bottom:16px;z-index:15;width:min(380px,calc(100% - 32px));max-height:60%;overflow:auto;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:0 24px 60px -20px rgba(23,22,26,.45),0 0 0 1px var(--line);animation:pop .22s var(--ease) both}
.pop[hidden]{display:none}
.pop .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.pop .who b{color:var(--ink);font-size:12px}
.pop h4{margin:0;font-size:14px;line-height:1.5}
.pop .acts{display:flex;gap:6px;margin-top:10px}
.pop .acts button{height:28px;padding:0 10px;border-radius:8px;font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.pop .acts .primary{background:var(--ink);color:#fff;box-shadow:none}
.menu.meetings{left:0;right:auto;top:42px;width:300px;max-height:min(440px,70vh);overflow:auto;transform-origin:top left}
.menu.meetings .new{background:var(--ink);color:var(--surface);margin-bottom:4px}.menu.meetings .new:hover{background:var(--ink-2)}.menu.meetings .new .glyph{background:rgba(255,255,255,.16);color:inherit}.menu.meetings .new em{color:rgba(255,255,255,.72)}
.menu.meetings .new.confirm{background:var(--rec)}
.menu.meetings .head{padding:8px 10px 4px;font-size:11.5px;color:var(--muted)}
.menu.meetings .live-dot{width:7px;height:7px;border-radius:50%;background:var(--rec)}
.menu button{width:100%;text-align:left;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 10px;border-radius:9px}
.menu button:hover{background:var(--paper)}
.menu b{display:block;font-weight:600;font-size:13px}
.menu em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.menu .on{background:var(--paper)}
.menu .on::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
.menu .glyph{width:22px;height:22px;border-radius:7px;background:var(--paper);display:grid;place-items:center;color:var(--ink-2)}
.menu .note{padding:8px 10px 4px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}

/* ---------- workspace ---------- */
main{flex:1;min-height:0;display:flex;gap:12px;padding:4px 12px 12px}
.stage{position:relative;flex:1;min-width:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 1px var(--line),0 30px 60px -40px rgba(23,22,26,.35);animation:rise .6s .05s var(--ease) both}
iframe{display:block;border:0;width:100%;height:100%}
.stage{container-type:inline-size}
.live-map[hidden]{display:none}
.stage.is-map > iframe{visibility:hidden}
.live-map{position:absolute;inset:0;overflow:auto;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/16px 16px,var(--surface);padding:20px clamp(12px,3cqw,30px) 32px}
.live-map h2{max-width:960px;margin:0 auto 22px;font-size:clamp(16px,2.2cqw,22px);line-height:1.4;overflow-wrap:anywhere}
.live-map-empty{margin:24px auto;color:var(--muted);text-align:center}
.live-map-branches{max-width:960px;margin:auto;border-inline-start:1px solid var(--line-2);padding-inline-start:16px}
.live-map-branch{--map-ink:#365686;--map-fill:#eef3fa;display:grid;gap:8px;position:relative;margin-bottom:16px;min-width:0}
.live-map-branch:nth-child(3n+2){--map-ink:#276454;--map-fill:#eaf5ef}
.live-map-branch:nth-child(3n){--map-ink:#79583c;--map-fill:#f9f1e7}
.live-map-branch h3{align-self:center;position:relative;margin:0;font-size:14px;color:var(--map-ink);overflow-wrap:anywhere}
.live-map-branch h3::before{content:"";position:absolute;inset-inline-start:-20px;top:calc(50% - 3px);width:7px;height:7px;border-radius:50%;background:var(--map-ink)}
.live-map-branch ul{display:grid;gap:6px;list-style:none;margin:0;min-width:0;border-inline-start:1px solid var(--map-ink);padding-inline-start:8px}
.live-map-card{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:var(--map-fill);color:#292d34;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.live-map-card{position:relative}
.live-map-card::before,.live-map-branch h3::after{content:"";position:absolute;top:50%;inset-inline-end:100%;width:8px;border-top:1px solid var(--map-ink)}
.live-map-branch h3::after{display:none}
.live-map-card b{color:var(--map-ink);font-size:12px}
.live-map-card span{flex:1;min-width:min(100%,120px);white-space:pre-line}
.live-map-card button,.live-map-more{color:var(--map-ink);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:4px}
.live-map-more{justify-self:start}
@container (min-width:700px){
  .live-map-branches{border:0;padding:0;background:linear-gradient(var(--line-2),var(--line-2)) center/1px 100% no-repeat}
  .live-map-branch{grid-template-columns:minmax(0,1fr) 126px minmax(0,1fr);align-items:center;gap:18px;margin-bottom:20px}
  .live-map-branch h3{grid-column:2;grid-row:1;text-align:center;background:var(--surface);border:1px solid var(--line-2);padding:7px;border-radius:8px}
  .live-map-branch h3::before{display:none}
  .live-map-branch h3::after{display:block;inset-inline-start:100%;width:18px}
  .live-map-branch:nth-child(even) h3::after,.live-map-branch:nth-child(even) .live-map-card::before{inset-inline-start:auto;inset-inline-end:100%}
  .live-map-branch:nth-child(even) .live-map-card::before{inset-inline-start:100%;inset-inline-end:auto}
  .live-map-branch ul{grid-column:3;grid-row:1;border-inline-start:1px solid var(--map-ink);padding-inline-start:8px}
  .live-map-branch:nth-child(even) ul{grid-column:1;border-inline-start:0;border-inline-end:1px solid var(--map-ink);padding-inline:0 8px}
}
.listening{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;pointer-events:none;padding:24px;width:min(360px,90%)}
.listening[hidden]{display:none}
.orb{position:relative;width:68px;height:68px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(23,22,26,.25);animation:ring 2.4s var(--ease) infinite}
.orb::after{animation-delay:1.2s}
.listening.idle .orb::before,.listening.idle .orb::after{animation:none;opacity:0}
.listening h2{margin:0;font-size:16px;font-weight:650}
.listening p{margin:0;font-size:13px;color:var(--muted)}

/* transcript panel */
.panel{width:340px;flex:none;display:flex;flex-direction:column;min-height:0;border-radius:var(--radius);background:rgba(255,255,255,.72);
  backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line);overflow:hidden;animation:rise .6s .1s var(--ease) both}
body:not(.panel-open) .panel{display:none}
.panel-head{display:flex;align-items:center;gap:8px;padding:4px 10px 0 9px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.panel-head h3{margin:0;font-size:13.5px;font-weight:650}
.panel-head .spacer{flex:1}
.panel-head .ghost{white-space:nowrap;flex:none}
.ghost{height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.ghost:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.feed{position:relative;flex:1;min-height:0;overflow:auto;padding:4px 16px 16px;scroll-behavior:smooth}
.line{position:relative;padding:10px 0 10px 54px;animation:enter .45s var(--ease) both}
.line time{position:absolute;left:0;top:12px;font-size:11px;color:var(--muted)}
.line p{margin:0;font-size:14px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.line.now p{color:var(--ink)}
.line.now::before{content:"";position:absolute;left:42px;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--rec)}
.line.failed p{color:var(--warn)}
.pending{display:flex;align-items:center;gap:8px;padding:10px 0 4px 54px;font-size:12.5px;color:var(--muted)}
.pending[hidden]{display:none}
.dots{display:inline-flex;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--muted);animation:bounce 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.empty{padding:28px 6px;color:var(--muted);font-size:13px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:4px}
.jump{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;box-shadow:0 10px 24px -10px rgba(23,22,26,.6);animation:pop .2s var(--ease) both}
.jump[hidden]{display:none}

function inline(text){let s=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');return s}
function markdown(src){const lines=String(src||'').replace(/\r/g,'').split('\n');const out=[];let list=null,code=null,table=null;
  const close=()=>{if(list){out.push('</'+list+'>');list=null}if(table){out.push('</table>');table=null}};
  for(const raw of lines){if(code!==null){if(/^```/.test(raw)){out.push('<pre><code>'+code.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>');code=null}else code+=raw+'\n';continue}
    if(/^```/.test(raw)){close();code='';continue}
    const line=raw.trimEnd();if(!line.trim()){close();continue}
    let m;
    if(/^\|.*\|$/.test(line.trim())){const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;if(!table){close();out.push('<table>');table=1;out.push('<tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>')}else out.push('<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');continue}
    if((m=line.match(/^(#{1,4})\s+(.*)$/))){close();out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');continue}
    if((m=line.match(/^\s*[-*•]\s+(.*)$/))){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+inline(m[1])+'</li>');continue}
    if((m=line.match(/^\s*\d+[.)、]\s*(.*)$/))){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+inline(m[1])+'</li>');continue}
    close();out.push('<p>'+inline(line)+'</p>')}
  if(code!==null)out.push('<pre><code>'+code.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>');close();return out.join('')}

  const label={point:'要点',proposal:'方案',risk:'风险',decision:'结论',action:'待办',question:'待确认',step:'步骤',status:'进度',cell:'对比',summary:'现状',block:'讨论'}[item.kind]||'';$('citeTitle').textContent=(label?label+' · ':'')+item.text;
  const nums=item.refs.map(id=>'#'+(Number(id.slice(1))+1));$('citeText').textContent='依据原文 '+nums.join('、')+(item.previous?' · 曾记为：'+item.previous:'');$('cite').hidden=false;
  if(!document.body.classList.contains('panel-open')){document.body.classList.add('panel-open');$('toggle').setAttribute('aria-pressed','true')}
  const first=rendered.get(item.refs.find(id=>rendered.has(id)));if(first){stick=false;first.scrollIntoView({block:'center',behavior:'smooth'})}}

// Time links from the conversation: "?at=seconds" when a link opened this tab, or a jump the meeting service relays when a
// link opened while this page was already showing (that tab closes itself). The caption spoken at that moment is shown.
let wantAt=(()=>{const v=new URLSearchParams(location.search).get('at')??new URLSearchParams(location.hash.slice(1)).get('at');return v!==null&&v!==''&&Number.isFinite(Number(v))?Number(v)*1000:null})(),focusSeen=null;
if(wantAt!==null)history.replaceState(null,'',location.pathname);
function followTimeLink(focus){
  if(focusSeen===null)focusSeen=focus?focus.nonce:0; // requests made before this page opened are not for it
  else if(focus&&focus.nonce!==focusSeen){focusSeen=focus.nonce;wantAt=focus.atMs}
  if(wantAt!==null&&showMoment(wantAt))wantAt=null}
function showMoment(ms){
  const lines=latest.meeting.segments.filter(s=>rendered.has(s.id));if(!lines.length)return false;
  const line=[...lines].reverse().find(s=>s.startMs<=ms+500)||lines[0];const row=rendered.get(line.id);
  setTab('feed');stick=false;row.scrollIntoView({block:'center',behavior:'smooth'});row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash');return true}
const expandedMapGroups=new Set();
const mapLabels={decision:'结论',action:'待办',question:'待确认',risk:'风险',proposal:'方案',point:'要点',step:'步骤',status:'进度',cell:'对比'};
const mapPriority=Object.keys(mapLabels);
let liveMapOpen=supportsLiveMap,mapRenderKey='';

function renderFormMenu(meeting){
  const plan=meeting?.plan;
  const boardForm=plan?.form || latest?.settings?.defaultForm || 'mindmap';
  const current=liveMapOpen ? LIVE_MAP_FORM : FORMS.find(form=>form[0]===boardForm) || FORMS[0];
  $('formLabel').textContent=current[1];
  $('formBy').textContent=liveMapOpen||!plan ? '默认' : meeting.requestedForm ? '切换中' : plan.lockedBy==='user' ? '已指定' : 'AI 选择';
  for(const button of $('menu').querySelectorAll('button[data-form]')){

async function selectForm(form){
  closeMenu();
  $('formBtn').focus();
  if(form===LIVE_MAP_FORM[0]){
    setStageMode(true);
    return;
  }
  const meeting=latest?.meeting;
  const boardForm=meeting?.plan?.form || latest?.settings?.defaultForm || 'mindmap';
  const returningFromMap=liveMapOpen;
  setStageMode(false);
  // Reopening the existing canvas is a view switch, including for a historical meeting.
  if(!returningFromMap || form!==boardForm) await post({action:'layout',form});

function renderLiveMap(meeting){
  const panel=$('liveMap');
  const items=meeting.items?.length ? meeting.items : (meeting.notes??[]).map(note=>({
    group:note.topic,kind:note.kind,text:note.text,refs:note.segmentIds
  }));
  const theme=meeting.plan?.theme || meeting.title;
  const empty=latest.settings?.autoSummary===false
    ? '自动整理已关闭，可打开字幕面板并点「立即整理」。'
    : s_live(meeting) ? '正在等待会议要点，整理完成后会显示在这里。' : '这场会议还没有整理出的要点。';
  const segments=new Map(meeting.segments.filter(segment=>rendered.has(segment.id)).map(segment=>[segment.id,segment]));
  const key=JSON.stringify([meeting.id,theme,items,empty,[...expandedMapGroups], [...segments.keys()]]);
  if(key===mapRenderKey)return;
  mapRenderKey=key;
  const groups=new Map();
  for(const item of items){
    if(!item.text)continue;
    const group=item.group || '综合讨论';
    if(!groups.has(group))groups.set(group,[]);
    groups.get(group).push(item);
  }
  const focusKey=panel.contains(document.activeElement) ? document.activeElement.dataset.mapFocus : null;
  const heading=el('h2',null,theme);
  const branches=el('div','live-map-branches');
  for(const [group,entries] of groups){
    const branch=el('section','live-map-branch');
    const list=el('ul');
    branch.append(el('h3',null,group),list);
    const rank=kind=>mapPriority.includes(kind) ? mapPriority.indexOf(kind) : mapPriority.length;
    const sorted=[...entries].sort((a,b)=>rank(a.kind)-rank(b.kind));
    const expanded=expandedMapGroups.has(group);
    for(const [index,item] of (expanded ? sorted : sorted.slice(0,3)).entries()){
      const card=el('li','live-map-card');
      card.append(el('b',null,mapLabels[item.kind]||'要点'),el('span',null,item.text));
      const segment=(item.refs??[]).map(id=>segments.get(id)).find(Boolean);
      if(segment){
        const jump=el('button',null,time(segment.startMs));
        jump.dataset.mapFocus=JSON.stringify([group,index]);
        jump.setAttribute('aria-label','查看 '+time(segment.startMs)+' 的字幕原文');
        jump.onclick=()=>showMoment(segment.startMs);
        card.append(jump);
      }
      list.append(card);
    }
    if(sorted.length>3){
      const more=el('button','live-map-more',expanded ? '收起' : '展开其余 '+(sorted.length-3)+' 条');
      more.dataset.mapFocus=group;
      more.setAttribute('aria-expanded',String(expanded));
      more.onclick=()=>{
        if(expanded)expandedMapGroups.delete(group);
        else expandedMapGroups.add(group);
        renderLiveMap(latest.meeting);
      };
      const tail=el('li');
      tail.append(more);
      list.append(tail);
    }
    branches.append(branch);
  }
  panel.replaceChildren(heading,groups.size ? branches : el('p','live-map-empty',empty));
  if(focusKey){
    const button=[...panel.querySelectorAll('button')].find(node=>node.dataset.mapFocus===focusKey);
    button?.focus({preventScroll:true});
  }
}
function setStageMode(showMap){
  liveMapOpen=showMap;
  $('liveMap').hidden=!showMap;
  $('board').closest('.stage').classList.toggle('is-map',showMap);
  renderFormMenu(latest?.meeting);
  if(showMap){
    $('listening').hidden=true;
    citeFor='';
    showCite(null);
    if(latest?.meeting)renderLiveMap(latest.meeting);

}
setStageMode(liveMapOpen);
setInterval(()=>{if(!liveMapOpen)void pollSelection()},500);

  const live=latest&&latest.meeting&&['starting','recording','paused','stopping'].includes(latest.meeting.phase);$('sNote').textContent=live?'识别模型、语言、名词、静音和分段从下一场会议生效；其余立即生效':'保存后用于新会议';
  $('drawer').hidden=false;$('scrim').hidden=false}catch{dismissed='';toast('暂时读取不到设置，请稍后重试')}}

function syncScript(){$('sScript').disabled=!['zh','auto'].includes($('sLang').value)}
$('sLang').onchange=syncScript;$('sRewrite').onchange=syncRewrite;$('sRewritePick').onchange=syncRewrite;
// The models the agent platform offers (read from it); without a list, or for "手动填写", the model name is typed.
function fillModels(list,chosen){const pick=$('sRewritePick');pick.replaceChildren();pick.hidden=!list.length;if(!list.length){$('sRewriteHint').textContent='没有读到可用模型列表，可填写模型名；留空时使用当前平台的默认模型。';return}
  const add=(value,label)=>{const o=document.createElement('option');o.value=value;o.textContent=label;pick.append(o)};const preferred=list.find(m=>m.isDefault);
  add('','默认'+(preferred?'（'+preferred.label+'）':'模型'));for(const m of list)add(m.id,m.label===m.id?m.id:m.label+' · '+m.id);add('__custom','手动填写…');

function chosenModel(){const pick=$('sRewritePick');return !pick.hidden&&pick.value!=='__custom'?(pick.value||null):($('sRewriteModel').value.trim()||null)}$('gear').onclick=openSettings;$('drawerClose').onclick=closeSettings;$('scrim').onclick=closeSettings;

const SCENE_EXAMPLES=[['会上提到线上问题、报错或 bug','整理问题现象、影响范围和复现线索，写成一条可以直接提交的缺陷描述'],['有人问到具体数据，但会上没人能马上回答','查询相关数据，给出结论和数据来源'],['会上定下了待办和负责人','整理成待办清单：事项、负责人、截止时间']];

    const field=(label,key,tag,ph)=>{const l=document.createElement('label');l.textContent=label;const input=document.createElement(tag);if(tag==='textarea')input.rows=2;else input.type='text';input.maxLength=200;input.placeholder=ph;input.value=sc[key];input.oninput=()=>{sc[key]=input.value;$('sceneWarn').hidden=!scenes.some(x=>!x.when.trim()||!x.action.trim())};l.append(input);return l};

    card.append(field('什么时候','when','input','例如：会上提到线上问题、报错或 bug'),field('让 AI 做什么','action','textarea','例如：整理问题现象和影响范围，写成一条缺陷描述'),row);list.append(card)});
  $('sceneAdd').hidden=scenes.length>=8;

let boardSpace='',reportedWidth=0,resizeTimer=0;
