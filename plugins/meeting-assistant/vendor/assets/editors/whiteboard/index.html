<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Whiteboard</title>
    <script type="module" crossorigin src="./assets/index-TrzGo_VR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DHbuI-cm.css">
  </head>
  <body>
    <div id="root"></div>
  <script>(()=>{let observer;const notify=()=>{if(!document.querySelector('[data-testid="board-canvas"]'))return;observer?.disconnect();parent.postMessage({type:"xj-meeting-board-ready",version:1},"*");};observer=new MutationObserver(notify);observer.observe(document.body,{childList:true,subtree:true});notify();setTimeout(()=>observer.disconnect(),30000);})();</script><script>(()=>{const fit=()=>window.dispatchEvent(new KeyboardEvent("keydown",{key:"0",code:"Digit0",metaKey:true,ctrlKey:true,bubbles:true,cancelable:true}));addEventListener("message",event=>{if(event.source===parent&&event.data&&event.data.type==="xj-meeting-board-fit")fit();});let width=innerWidth,timer=0;addEventListener("resize",()=>{clearTimeout(timer);timer=setTimeout(()=>{if(Math.abs(innerWidth-width)>width*.15){width=innerWidth;fit();}},400);});})();</script></body>
</html>
